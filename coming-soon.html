<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechnoFineHub — Coming Soon</title>
<meta name="description" content="TechnoFineHub is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; }

  html, body{ margin: 0; height: 100%; }

  body{
    background: #000000;
    color: #F4F4F4;
    font-family: 'Jost', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 8vw 6vw;
    text-align: center;
  }

  .stage{
    opacity: 0;
    animation: rise 1.1s ease-out 0.2s forwards;
  }

  h1{
    font-family: 'Bodoni Moda', serif;
    font-weight: 600;
    font-size: clamp(3rem, 10vw, 7.5rem);
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #E4E4E4 40%, #9C9C9C 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 em{
    font-style: italic;
    font-weight: 500;
  }

  .rule{
    width: 48px;
    height: 1px;
    background: #8A8A8A;
    margin: 30px auto;
  }

  .site{
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #8A8A8A;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(12px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <h1>Coming<br><em>Soon</em></h1>
    <div class="rule"></div>
    <p class="site">technofinehub.online</p>
  </div>
</body>
</html>
